# Rename `app` to something unique before the first deploy.
app = "whisperpoll"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

# Polls live in the server's memory, so run exactly one machine and never
# stop it: a second machine would split polls between them, and a stopped
# one forgets every poll. (A deploy restarts it, which also clears polls.)
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
