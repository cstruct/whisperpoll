[package]
name = "whisperpoll-web"
version = "0.1.0"
edition = "2021"
description = "Browser client for whisperpoll (build with trunk)"

[dependencies]
whisperpoll-core = { path = "../core" }
whisperpoll-protocol = { path = "../protocol" }
leptos = { version = "0.8", features = ["csr"] }
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "CloseEvent",
  "Clipboard",
  "HtmlInputElement",
  "Location",
  "MessageEvent",
  "Navigator",
  "Storage",
  "UrlSearchParams",
  "WebSocket",
] }
