[package]
name = "whisperpoll-protocol"
version = "0.1.0"
edition = "2021"
description = "Messages between the whisperpoll server and browser clients"

[dependencies]
whisperpoll-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
