[package]
name = "whisperpoll-server"
version = "0.1.0"
edition = "2021"
description = "Websocket relay and bulletin board for whisperpoll"

[dependencies]
whisperpoll-core = { path = "../core" }
whisperpoll-protocol = { path = "../protocol" }
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "process", "io-util"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
