[package]
name = "rust_lib_whisperpoll"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
whisperpoll-core = { path = "../../crates/core" }
whisperpoll-protocol = { path = "../../crates/protocol" }
whisperpoll-muzak = { path = "../../crates/muzak" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
